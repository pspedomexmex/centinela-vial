# Centinela Vial — Fly.io config
app = "centinela-vial"
primary_region = "mia"  # Miami — más cerca de México

[build]
  dockerfile = "Dockerfile"

# Sin HTTP — es un worker puro de Telegram polling
[processes]
  worker = "python main.py"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Volumen persistente para SQLite
[[mounts]]
  source = "centinela_data"
  destination = "/data"

[env]
  DB_PATH = "/data/centinela_vial.db"
  CHECK_INTERVAL_MIN = "30"
  TRAFFIC_INTERVAL_MIN = "60"
