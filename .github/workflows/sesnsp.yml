name: Centinela Vial — Importar SESNSP (Robos Mensuales)

on:
  schedule:
    - cron: '0 12 1 * *'   # 1° de cada mes a las 06:00 MX (12:00 UTC)
  workflow_dispatch:        # disparo manual desde GitHub

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Importar datos SESNSP
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SESNSP_URL:        ${{ secrets.SESNSP_URL }}
        run: python monitor/import_sesnsp.py
