name: Centinela Vial — Monitor de Rutas (alertas)

# Revisa los viajes activos cada 30 minutos y envía alertas nuevas a Telegram.
# Lee el estado de state/viajes.json y actualiza el de-dup en state/alertas.json.
on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # disparo manual desde la pestaña Actions

# Permiso mínimo: solo escribir contenido para commitear el estado (state/).
permissions:
  contents: write

# Mismo grupo de concurrencia que bot.yml: nunca escriben el estado a la vez.
concurrency:
  group: centinela-estado
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOMTOM_KEY:         ${{ secrets.TOMTOM_KEY }}
        run: python monitor/run.py

      - name: Commitear estado (si cambió)
        run: |
          git config user.name  "centinela-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "estado: ciclo de monitoreo [skip ci]"
            # Reintento ante posible carrera con bot.yml.
            git push || (git pull --rebase --autostash && git push)
          fi
