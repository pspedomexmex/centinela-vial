name: Centinela Vial — Cosecha RCPN

on:
  schedule:
    - cron: '0 12 * * *'   # 07:00 México (mañana)
    - cron: '0 22 * * *'   # 17:00 México (tarde)
  workflow_dispatch:        # disparo manual desde GitHub

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cosechar noticias RCPN
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python monitor/harvest_rcpn.py
